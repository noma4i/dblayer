[package]
name = "dblayer-gen"
version = "1.2.0"
edition = "2021"

[lib]
name = "dblayer_gen"

[[bin]]
name = "dblayer-gen"
path = "src/main.rs"

[dependencies]
dblayer = { version = "1.2.0", path = "../core" }
graphql-parser = "0.4.1"
serde_json = "1.0.151"
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
