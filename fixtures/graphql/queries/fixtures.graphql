query ClubMembers($clubId: ID!, $order: String, $first: Int, $after: String) { node: clubMembers(clubId: $clubId, order: $order) { members(first: $first, after: $after) { edges { cursor node { id name } } pageInfo { hasNextPage endCursor } } } }
query MomentTranscodeStatus($momentId: ID!) { node(id: $momentId) { ... on Moment { id uuid userId text likedByMe media createdAt } } }
query MomentsFeed($vibeId: String, $first: Int, $after: String) { momentsFeed(vibeId: $vibeId, first: $first, after: $after) { edges { cursor impressionUuid impressionScore rank node { id uuid userId text likedByMe media createdAt } } pageInfo { hasNextPage endCursor } } }
query LedgerEntries($scope: String!, $first: Int, $after: String) { ledgerEntries(scope: $scope, first: $first, after: $after) { edges { cursor impressionUuid node { id title } } pageInfo { hasNextPage endCursor } } }
query ShadowScope($first: Int, $after: String) { shadowScope(first: $first, after: $after) { edges { cursor score node { id title } } pageInfo { hasNextPage endCursor } } }
query ShadowAccount($first: Int, $after: String) { shadowAccount(first: $first, after: $after) { edges { cursor rank node { id title } } pageInfo { hasNextPage endCursor } } }
query MailboxEntries($act: String!, $first: Int, $after: String) { mailboxEntries(act: $act, first: $first, after: $after) { edges { cursor score node { id read put } } pageInfo { hasNextPage endCursor } } }
query AccountProfile { accountProfile { id label } }
query ContainerNode($id: ID!) { node(id: $id) { ... on Container { id title shareUrl isPublic shelves } } }
query ContainersByIds($ids: [ID!]!) { nodes(ids: $ids) { ... on Container { id title shareUrl isPublic shelves } } }
query ContainerShelfQuery($shelf: ContainerShelf!) { containers: containerShelf(shelf: $shelf) { id title shareUrl isPublic shelves } }
query ContainerSearch($text: String!) { search: containerSearch(text: $text) { containers { id container { id title } } } }
query documentBySlug($slug: String!, $source: String!) { documentBySlug(slug: $slug, source: $source) { id slug previewIds cover { imageUrl width stage progress } previews { ...RecordFields } } }
query tailSince($containerId: String!, $afterSequence: Int!, $pinned: Boolean!, $first: Int, $after: String) { tailSince(containerId: $containerId, afterSequence: $afterSequence, pinned: $pinned, first: $first, after: $after) { edges { cursor node { id text } } pageInfo { hasNextPage endCursor } } }
query ChatNode($id: ID!) { node(id: $id) { ... on Chat { id title revision lists } } }
query ChatList($list: String!) { chats(list: $list) { id title revision lists } }
query MessageNode($id: ID!) { node(id: $id) { ... on Message { id text chatId } } }
query CurrentUserQuery { viewer { id name } }
query CurrentRegionQuery { region { id name } }
query UserProfile { userProfile { id name birthday } }
query ContainerMembers($containerId: String!, $first: Int, $after: String) { node: containerMembers(containerId: $containerId) { membersCount members(first: $first, after: $after) { edges { cursor node { id name birthday } } pageInfo { hasNextPage endCursor } } } }
query PresenceOnline { presenceOnline { id userId room } }
query PresenceOnChannel($channel: String!) { presenceOnChannel(channel: $channel) { id userId room } }
query PresenceHistory($presenceId: ID!) { presenceHistory(presenceId: $presenceId) { id userId room } }
query ContainerThread($containerId: ID!, $first: Int, $after: String) { container: containerById(id: $containerId) { records(first: $first, after: $after) { edges { cursor node { ...RecordFields } } pageInfo { hasNextPage endCursor } } } }
query RecordNode($id: ID!) { node(id: $id) { ... on Record { ...RecordFields } } }
query RecordTranscodeStatus($id: ID!) { node(id: $id) { ... on Record { ...RecordFields } } }
query ContainerMedia($containerId: ID!, $first: Int, $after: String) { node: containerRecords(containerId: $containerId) { records(first: $first, after: $after) { edges { cursor node { ...RecordFields } } pageInfo { hasNextPage endCursor } } } }
query ContainerRecords($first: Int, $last: Int, $before: String) { containerRecordsHistory(first: $first, last: $last, before: $before) { edges { cursor node { ...RecordFields } } pageInfo { hasNextPage endCursor } } }
query RecentMedia($containerId: ID!, $first: Int, $after: String) { recentMedia(containerId: $containerId, first: $first, after: $after) { edges { cursor node { ...RecordFields } } pageInfo { hasNextPage endCursor } } }
query SampleNode($id: ID!) { node(id: $id) { ... on InterfaceRecord { id slug spec { root elements { __typename id children press { __typename ... on SampleNavigateAction { slug title } ... on SampleOpenRecordAction { recordId } ... on SampleOpenExternalAction { url } ... on SampleOpenProfileAction { userId } } visible { __typename ... on SampleCondition { comparison negated operand { __typename ... on SampleFlagLiteral { flag } ... on SampleNumberLiteral { number } ... on SampleStateRef { path } ... on SampleTextLiteral { text } } path } ... on SampleVisibleAll { conditions { comparison negated operand { __typename ... on SampleFlagLiteral { flag } ... on SampleNumberLiteral { number } ... on SampleStateRef { path } ... on SampleTextLiteral { text } } path } } ... on SampleVisibleAny { conditions { comparison negated operand { __typename ... on SampleFlagLiteral { flag } ... on SampleNumberLiteral { number } ... on SampleStateRef { path } ... on SampleTextLiteral { text } } path } } ... on SampleVisibleFlag { flag } } ... on SampleButton { label { __typename ... on SampleStateRef { path } ... on SampleTextLiteral { text } } disabled { __typename ... on SampleFlagLiteral { flag } ... on SampleStateRef { path } } } ... on SampleColumn { gap { __typename ... on SampleNumberLiteral { number } ... on SampleStateRef { path } } alignItems } ... on SampleHeading { text { __typename ... on SampleStateRef { path } ... on SampleTextLiteral { text } } level } ... on SampleSpacer { length { __typename ... on SampleNumberLiteral { number } ... on SampleStateRef { path } } } ... on SampleSwitch { checked { __typename ... on SampleFlagLiteral { flag } ... on SampleStateRef { path } } label { __typename ... on SampleStateRef { path } ... on SampleTextLiteral { text } } } } state { path value { __typename ... on SampleFlagLiteral { flag } ... on SampleNumberLiteral { number } ... on SampleTextLiteral { text } } } } } } }
query ScreenNode($id: ID!) { node(id: $id) { ... on CustomScreen { id slug version requires { ios android } spec { root state { path value } elements { id type slot children props visible press change padding margin background radius expand align accessibilityLabel } } } } }
query MediaMessageNode($id: ID!) { node(id: $id) { ... on MediaMessage { id chatId kind mediaKind sequenceNumber } } }
query ChatMedia($chatId: ID!, $mediaKinds: [MediaKindValue!], $includeGifts: Boolean, $afterSequence: Int, $first: Int, $after: String) { node: mediaChat(id: $chatId) { messages(mediaKinds: $mediaKinds, includeGifts: $includeGifts, afterSequence: $afterSequence, first: $first, after: $after) { edges { cursor node { id chatId kind mediaKind sequenceNumber } } pageInfo { hasNextPage endCursor } } } }
