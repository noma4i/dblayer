query Pricing { pricing { gifts { id name price } videoIntro { enabled } tags spec } }
query Giphy($type: String!, $limit: Int) { giphy(type: $type, limit: $limit) { id url isSticker } }
query inbox($list: ChatShelfKind, $first: Int, $after: String) { inbox(list: $list, first: $first, after: $after) { edges { cursor node { id title } } pageInfo { hasNextPage endCursor } } }
