type Query { keywordCall(class: String!): KeywordResult!, ping: Int, inbox(list: ContainerShelfKind, first: Int, after: String): InboxConnection!, containerMembers(containerId: ID!, order: ContainerMemberOrder = JOINED, first: Int, after: String): InboxConnection!, pricing: Pricing, giphy(type: String!, limit: Int): [Giphy!]!, containerMedia(containerId: ID!, upToSequence: Int): ContainerMedia, node(id: ID!): MediaNode, blobProfile: BlobProfile, peerLoad: PeerHolder }
type KeywordResult { default: String!, when: String!, container: String!, r: String! }
type Mutation { qrCodeCreate(input: CreateQrCodeInput!): QrCode, signOut: Boolean, stickerSend(input: StickerInput!): Sticker, momentCreate(input: MomentInput!): MomentCreated, widgetsSend(widgets: [StickerWidgetInput!]): Sticker, clipCreate(signedId: String!, widgets: [StickerWidgetInput!]): ClipCreated, inboxMove(id: ID!, list: ContainerShelfKind!): Inbox, blobCreate(filename: String!, contentType: String!, byteSize: Int!, checksum: String!): BlobGrant!, setVideo(id: ID!, signedId: String!): BlobProfileResult! }
type ClipCreated { clip: Clip }
type Clip { id: ID!, title: String }
type MomentCreated { moment: Moment }
type Moment { id: ID! }
type Pricing { rewards: [Reward!]!, videoIntro: VideoIntro, tags: [String!], spec: JSON }
type Reward { id: ID!, name: String!, price: Int! }
type VideoIntro { enabled: Boolean! }
type Giphy { id: ID!, url: String!, isSticker: Boolean! }
type QrCode { url: String }
type Sticker { id: ID }
input CreateQrCodeInput { kind: String!, size: Int }
scalar DateTime
enum Mood { HAPPY SAD }
input StickerInput { name: String!, mood: Mood, tags: [String!]!, notes: [String], size: Int, pinned: Boolean!, owner: OwnerInput!, helpers: [OwnerInput!], recursive: RecursiveInput, keywords: KeywordInput }
input KeywordInput { default: String!, when: String!, class: String!, container: String!, encoder: String!, choices: [KeywordChoice!]! }
input KeywordChoice @oneOf { default: String, when: String }
input RecursiveInput { next: RecursiveInput, choice: RecursiveChoice }
input RecursiveChoice @oneOf { next: RecursiveChoice, value: String }
input OwnerInput { id: ID!, nickname: String }
scalar JSON
enum WidgetKind { EMOJI GIF }
input SettingsInput { itemProps: JSON!, rotate: Float }
input WidgetInput { kind: WidgetKind!, settings: SettingsInput! }
input MomentInput { file: String!, widgets: [WidgetInput!] = [] }
directive @oneOf on INPUT_OBJECT
input StickerTextInput { body: String!, sizes: [Int!] }
input StickerEmojiInput { code: String!, kind: WidgetKind }
input StickerPropsInput @oneOf { text: StickerTextInput, emoji: StickerEmojiInput, tags: [String!] }
input StickerWidgetInput { kind: WidgetKind!, props: StickerPropsInput!, extras: [StickerPropsInput!] }
enum ContainerShelfKind { PRIMARY SECONDARY }
type Inbox { id: ID!, title: String!, stance: String }
type InboxConnection { edges: [InboxEdge!]!, pageInfo: InboxPageInfo! }
type InboxEdge { cursor: String!, node: Inbox! }
type InboxPageInfo { hasNextPage: Boolean!, endCursor: String }
enum ContainerMemberOrder { JOINED OWNER_FIRST }
type ContainerMedia { visualCount: Int!, audioCount: Int!, rewardCount: Int!, latestSequence: Int }
scalar Int64
interface MediaNode { id: ID! }
type Chat implements MediaNode { id: ID!, mediaLibrary(upToSequence: Int): ChatMediaLibrary!, messages(afterSequence: Int, first: Int, after: String): MediaConnection! }
type ChatMediaLibrary { revision: Int64!, visualCount: Int!, audioCount: Int!, giftCount: Int!, latestSequence: Int! }
type MediaEntry { id: ID!, text: String, sequenceNumber: Int! }
type MediaConnection { nodes: [MediaEntry!]!, pageInfo: InboxPageInfo! }
type BlobProfile { id: ID!, label: String }
type BlobGrant { url: String!, headers: String, signedId: String!, blobId: ID! }
type BlobProfileResult { profile: BlobProfile! }
type PeerHolder { peer: Peer }
type Person { name: String }
type Robot { serial: String }
union Peer = Person | Robot
