query sessionProfile {
  viewer {
    user {
      id
      avatarUrl
    }
    profile {
      registrationCompleted
      registrationStep
      hasPhoto
      hasGoodPhoto
      dateOfBirth
      name
      gender
      country {
        code
      }
    }
  }
}

query myProfile {
  viewer {
    user {
      ...UserFullFragment
    }
    wallet {
      ...WalletFragment
      premium {
        localizedPrice
      }
    }
    counters {
      ...CountersFragment
    }
    ...ViewerSettingsFragment
    profile {
      country {
        code
      }
      hasCompass
      hasGoodPhoto
      hasInitialMoment
      hasMoments
      hasPhoto
      kind
      registrationCompleted
      status
      stickyLocation
      location {
        ...LocationFragment
      }
      mainPhoto {
        ...UserPhotoFragment
        media {
          ...MediaFragment
        }
      }
      receivedGifts {
        count
        gift {
          ...GiftFragment
        }
        items {
          id
          createdAt
          sender {
            ...UserMinimalFragment
          }
        }
      }
    }
  }
}
