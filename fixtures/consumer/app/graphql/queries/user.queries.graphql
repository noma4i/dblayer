query userByUuid($uuid: String!) {
  userByUuid(uuid: $uuid) {
    ...PublicUserFragment
  }
}

query userProfile($id: ID!) {
  user(id: $id) {
    ...PublicUserFragment
  }
}

query userProfileWithMoments($id: ID!, $first: Int) {
  user(id: $id) {
    ...UserFullFragment
    moments(first: $first) {
      edges {
        impressionScore
        impressionUuid
        node {
          ...ProfileMomentFragment
        }
      }
      pageInfo {
        ...PageInfoFragment
      }
    }
  }
}

query blockedUsers($first: Int, $after: Cursor) {
  viewer {
    blockedUsers(first: $first, after: $after) {
      totalCount
      edges {
        node {
          ...UserStandardFragment
        }
      }
      pageInfo {
        ...PageInfoFragment
      }
    }
  }
}

query friendUsers($first: Int, $after: Cursor) {
  viewer {
    friends(first: $first, after: $after) {
      totalCount
      edges {
        node {
          ...UserStandardFragment
        }
      }
      pageInfo {
        ...PageInfoFragment
      }
    }
  }
}

query userDeveloper($id: ID!) {
  user(id: $id) {
    ...DeveloperUserFragment
  }
}
