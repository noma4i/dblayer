query chats($list: ChatList, $first: Int, $after: Cursor) {
  viewer {
    chats(filter: { list: $list }, first: $first, after: $after) {
      totalCount
      edges {
        cursor
        node {
          ...ChatFragment
        }
      }
      pageInfo {
        ...PageInfoFragment
      }
    }
  }
}

query chatMembers($chatId: ID!, $order: ChatMemberOrder, $first: Int, $after: Cursor) {
  node(id: $chatId) {
    ... on Chat {
      membersCount
      members(first: $first, after: $after, order: $order) {
        totalCount
        edges {
          cursor
          node {
            ...UserStandardFragment
          }
        }
        pageInfo {
          ...PageInfoFragment
        }
      }
    }
  }
}

query chatMemberCandidates($chatId: ID!, $userIds: [ID!]!) {
  node(id: $chatId) {
    ... on Chat {
      members(first: 100, userIds: $userIds) {
        edges {
          node {
            id
          }
        }
      }
    }
  }
}
