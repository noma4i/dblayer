query chatByUuid($uuid: String!) {
  chatByUuid(uuid: $uuid) {
    ...ChatFragment
  }
}

query ChatNode($id: ID!) {
  node(id: $id) {
    ... on Chat {
      ...ChatFragment
      shareUrl
      isPublic
      history
    }
  }
}

query chatThread($chatId: ID!, $first: Int, $after: Cursor) {
  node(id: $chatId) {
    ... on Chat {
      ...ChatFragment
      shareUrl
      isPublic
      history
      messages(first: $first, after: $after) {
        totalCount
        edges {
          node {
            ...MessageFragment
          }
        }
        pageInfo {
          ...PageInfoFragment
        }
      }
    }
  }
}

query chatMedia($chatId: ID!, $mediaKinds: [MediaKind!], $includeGifts: Boolean, $afterSequence: Int, $first: Int, $after: Cursor) {
  node(id: $chatId) {
    ... on Chat {
      messages(filter: { mediaKinds: $mediaKinds, includeGifts: $includeGifts, afterSequence: $afterSequence }, first: $first, after: $after) {
        totalCount
        edges {
          node {
            ...MessageFragment
          }
        }
        pageInfo {
          ...PageInfoFragment
        }
      }
    }
  }
}

query chatMediaState($chatId: ID!, $upToSequence: Int) {
  node(id: $chatId) {
    ... on Chat {
      mediaLibrary(upToSequence: $upToSequence) {
        revision
        visualCount
        audioCount
        giftCount
        latestSequence
      }
    }
  }
}

query MomentNode($momentId: ID!) {
  node(id: $momentId) {
    ... on Moment {
      ...MomentCardFragment
      visitors(first: 3, order: ID_DESC) {
        edges {
          node {
            ...UserStandardFragment
          }
        }
      }
    }
  }
}

query momentVisitors($momentId: ID!, $first: Int, $after: Cursor) {
  node(id: $momentId) {
    ... on Moment {
      visitors(first: $first, after: $after) {
        edges {
          node {
            ...UserStandardFragment
          }
        }
        pageInfo {
          ...PageInfoFragment
        }
      }
    }
  }
}

query MessageNode($id: ID!) {
  node(id: $id) {
    ... on Message {
      ...MessageFragment
    }
  }
}
