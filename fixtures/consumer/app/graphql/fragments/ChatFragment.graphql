fragment ChatFragment on Chat {
  id
  uuid
  kind
  name
  logoUrl
  description
  messagesCount
  membersCount
  lastActivityAt
  lastMessageAt
  connectedAt
  createdAt
  updatedAt
  ownerId
  revision
  viewerState {
    list
    lists
    connectionStatus
    premium
    pinned
    muted
    mutedUntil
    read
    unreadCount
    readMarks {
      ...ReadMarksFragment
    }
  }
  opponent {
    ...UserStandardFragment
  }
  summary {
    id
    body
    languageCode
    generatedAt
  }
  lastMessage {
    ...LastMessageFragment
  }
}
