mutation ConnectionUpdate($input: ConnectionUpdateInput!) {
  connectionUpdate(input: $input) {
    counters {
      ...CountersFragment
    }
    user {
      ...UserStandardFragment
    }
    chat {
      ...ChatFragment
    }
  }
}

mutation UserBlock($input: UserBlockInput!) {
  userBlock(input: $input) {
    user {
      ...PublicUserFragment
    }
  }
}

mutation UserUnblock($input: UserUnblockInput!) {
  userUnblock(input: $input) {
    user {
      ...PublicUserFragment
    }
  }
}

mutation UserReport($input: UserReportInput!) {
  userReport(input: $input) {
    reported
  }
}

mutation MomentReport($input: MomentReportInput!) {
  momentReport(input: $input) {
    reported
  }
}

mutation ChatReport($input: ChatReportInput!) {
  chatReport(input: $input) {
    chatRemoved
  }
}

mutation MessageReport($input: MessageReportInput!) {
  messageReport(input: $input) {
    reported
  }
}

mutation ConnectionSeen($input: ConnectionSeenInput!) {
  connectionSeen(input: $input) {
    user {
      id
    }
  }
}
