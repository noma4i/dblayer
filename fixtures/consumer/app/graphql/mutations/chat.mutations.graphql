mutation ChatActionSet($input: ChatActivitySetInput!) {
  chatActivitySet(input: $input) {
    chat {
      id
    }
  }
}

mutation ChatRead($input: ChatReadInput!) {
  chatRead(input: $input) {
    chat {
      ...ChatFragment
    }
    counters {
      ...ChatCountersFragment
    }
  }
}

mutation ChatPin($input: ChatPinInput!) {
  chatPin(input: $input) {
    chat {
      ...ChatFragment
    }
  }
}

mutation ChatMute($input: ChatMuteInput!) {
  chatMute(input: $input) {
    chat {
      ...ChatFragment
    }
  }
}

mutation ChatGroupCreateFile($name: String!, $userIds: [ID!]!, $signedId: String!) {
  groupChatCreate(input: { name: $name, userIds: $userIds, signedId: $signedId }) {
    skippedUserIds
    chat {
      ...ChatFragment
    }
  }
}

mutation ChatGroupUpdateFile($chatId: ID!, $name: String, $signedId: String!) {
  groupChatUpdate(input: { chatId: $chatId, name: $name, signedId: $signedId }) {
    skippedUserIds
    chat {
      ...ChatFragment
    }
  }
}

mutation ChatGroupDelete($input: GroupChatDeleteInput!) {
  groupChatDelete(input: $input) {
    deletedId
  }
}

mutation ChatGroupLeave($input: GroupChatLeaveInput!) {
  groupChatLeave(input: $input) {
    removedChatId
  }
}

mutation ChatGroupCreate($input: GroupChatCreateInput!) {
  groupChatCreate(input: $input) {
    skippedUserIds
    chat {
      ...ChatFragment
    }
  }
}

mutation ChatGroupUpdate($input: GroupChatUpdateInput!) {
  groupChatUpdate(input: $input) {
    skippedUserIds
    chat {
      ...ChatFragment
    }
  }
}

mutation ChatSecondaryRead($input: SecondaryChatsReadInput!) {
  secondaryChatsRead(input: $input) {
    chatIds
    counters {
      ...ChatCountersFragment
    }
  }
}

mutation MessageSend($input: MessageSendInput!) {
  messageSend(input: $input) {
    message {
      ...MessageFragment
    }
    chat {
      ...ChatFragment
    }
  }
}

mutation MessageSendFile($chatId: ID!, $kind: MessageKind!, $signedId: String!, $replyToId: ID) {
  messageSend(input: { chatId: $chatId, kind: $kind, signedId: $signedId, replyToId: $replyToId }) {
    message {
      ...MessageFragment
    }
    chat {
      ...ChatFragment
    }
  }
}

mutation MessageSendAlbumFile($chatId: ID!, $kind: MessageKind!, $signedId: String!, $clientKey: String!) {
  messageSend(input: { chatId: $chatId, kind: $kind, signedId: $signedId, clientMutationId: $clientKey }) {
    message {
      ...MessageFragment
      clientKey
    }
    chat {
      ...ChatFragment
    }
  }
}

mutation MessageAlbumSend($input: MessageAlbumSendInput!) {
  messageAlbumSend(input: $input) {
    messages {
      ...MessageFragment
      clientKey
    }
  }
}

mutation MessageForward($input: MessageForwardInput!) {
  messageForward(input: $input) {
    message {
      ...MessageFragment
    }
    chat {
      id
      updatedAt
    }
  }
}

mutation MessageUpdate($input: MessageUpdateInput!) {
  messageUpdate(input: $input) {
    message {
      ...MessageFragment
    }
    chat {
      ...ChatFragment
    }
  }
}

mutation MessageDelete($input: MessageDeleteInput!) {
  messageDelete(input: $input) {
    deletedId
    chatId
  }
}

mutation ChatScreenshotTaken($input: ChatScreenshotTakenInput!) {
  chatScreenshotTaken(input: $input) {
    success
  }
}
