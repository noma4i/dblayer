mutation RegistrationProfileUpdate($input: ProfileUpdateInput!) {
  profileUpdate(input: $input) {
    viewer {
      user {
        id
      }
    }
  }
}

mutation UserRegistrationComplete {
  registrationComplete {
    viewer {
      user {
        id
      }
      profile {
        feedVariant
        registrationCompleted
      }
    }
  }
}
