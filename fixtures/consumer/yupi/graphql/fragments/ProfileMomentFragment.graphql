fragment ProfileMomentFragment on Moment {
  id
  uuid
  kind
  status
  contentKind
  createdAt
  updatedAt
  reacted
  shareUrl
  similarMomentsCount
  unreadCount
  unreadSimilarMomentsCount
  visitsCount
  compassTitle
  compassUpdatedAt
  user {
    id
    fullName
    username
    avatarUrl
    updatedAt
    relationship {
      lastInteraction
    }
  }
  media {
    ...MediaFragment
  }
  widgets {
    ...MomentWidgetFragment
  }
}
