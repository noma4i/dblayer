query lookupLocations($latitude: Float!, $longitude: Float!) {
  locationLookup(latitude: $latitude, longitude: $longitude) {
    ...LocationFragment
  }
}

query GetCountries {
  countries {
    code
    name
    priority
    priorityRank
  }
}

query meCompass($first: Int, $after: Cursor) {
  viewer {
    compassMoments(first: $first, after: $after) {
      edges {
        node {
          ...MomentCardFragment
          similarMoments {
            unseen
            moment {
              ...MomentCardFragment
            }
          }
        }
      }
      pageInfo {
        ...PageInfoFragment
      }
    }
  }
}
