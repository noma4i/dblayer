query feed($vibeId: ID, $after: Cursor) {
  feed(filter: { vibeId: $vibeId }, after: $after) {
    edges {
      cursor
      sequenceNumber
      impressionScore
      impressionUuid
      node {
        ...MomentCardFragment
      }
    }
    pageInfo {
      ...PageInfoFragment
    }
  }
}

query friendFeed($first: Int, $after: Cursor) {
  friendsFeed(first: $first, after: $after) {
    edges {
      cursor
      sequenceNumber
      node {
        ...MomentCardFragment
      }
    }
    pageInfo {
      ...PageInfoFragment
    }
  }
}
