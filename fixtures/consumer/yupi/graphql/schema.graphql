  """
  chatMessageSearch(
    """
    Chat to search in
    """
    chatId: ID!

    """
    Text to look for
    """
    query: String!
  ): [Message!]

  """
  Similar moments of an own moment, null for any other moment
  """
  compassForMoment(
    """
    Id of an own moment
    """
    momentId: ID!
  ): CompassForMoment

  """
  Active countries ordered by name
  """
  countries: [Country!]!

  """
  Published custom screen found by slug, null for a draft, an archived or an unknown slug
  """
  customScreenBySlug(
    """
    Stable key of the screen
    """
    slug: String!
  ): CustomScreen

  """
  Published custom screen opened by a client hook, null for a draft, an archived or an unknown key
  """
  customScreenByTrigger(
    """
    Value of triggerKey
    """
    key: String!
  ): CustomScreen

  """
  Published custom screens by name
  """
  customScreens: [CustomScreen!]!

  """
  Developer accounts only. One custom screen in any state, null for an unknown slug or a missing version
  """
  developerCustomScreen(
    """
    Stable key of the screen
    """
    slug: String!

    """
    Document to read
    """
    source: CustomScreenSourceInput!
  ): DeveloperCustomScreen

  """
  Developer accounts only. Every custom screen in every state, last changed first
  """
  developerCustomScreens: [DeveloperCustomScreen!]!

  """
  Campaigns the viewer can claim or skip now
  """
  eligibleCampaigns: [Campaign!]!

  """
  Feed of 20 moments per page, the main feed or the feed of one vibe. after is
  the cursor of the last edge seen of the same feed, an empty page does not end
  the feed. An unknown, draft or not visible vibe is NOT_FOUND, never the main feed
  """
  feed(
    """
    Cursor of the last moment of the previous chunk, absent for the first chunk
    """
    after: Cursor

    """
    Narrows the feed to one vibe
    """
    filter: FeedFilter
  ): MomentConnection!

  """
  Visible moments of friends, newest first
  """
  friendsFeed(
    """
    Cursor of the last moment of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 20
  ): MomentConnection!

  """
  Active gift catalog in catalog order
  """
  gifts(
    """
    Cursor of the last gift of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 20
  ): GiftConnection!

  """
  Giphy trending items, or search results for a query. An outage of Giphy is an
  error SERVICE_UNAVAILABLE, never an empty page
  """
  giphy(
    """
    Catalog to read
    """
    kind: GiphyKind!

    """
    Items to return
    """
    limit: Int = 24

    """
    Items to skip, use nextOffset of the previous page
    """
    offset: Int = 0

    """
    Search text, absent for the trending items
    """
    query: String
  ): GiphyPage!

  """
  Hard client limits of the API
  """
  limits: ApiLimits!

  """
  Reverse geocodes a point into a place, null when the point has no address.
  Nothing is stored: userLocationUpdate stores a place
  """
  locationLookup(
    """
    Latitude in degrees
    """
    latitude: Float!

    """
    Longitude in degrees
    """
    longitude: Float!
  ): UserLocation

  """
  Enabled message prompts of a placement in the locale of the client, by
  position. A locale the app does not support gives English, a text missing in
  the locale gives its English text. The client keeps the block title itself
