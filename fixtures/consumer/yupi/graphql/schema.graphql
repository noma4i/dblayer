"""
Direct, group or system conversation visible to the viewer. Not visible means null, never an error
"""
type Chat implements Node {
  """
  When the connection of a direct chat was accepted, null for other kinds and while the connection is pending
  """
  connectedAt: ISO8601DateTime

  """
  Creation time of the chat
  """
  createdAt: ISO8601DateTime!

  """
  Group description, null when none
  """
  description: String

  """
  Whether a new member sees earlier messages
  """
  history: ChatHistory!

  """
  Opaque stable identifier
  """
  id: ID!

  """
  Stored flag set by the group owner. It grants no join by link: chatByUuid and
  every chat read return only chats the viewer is already a member of
  """
  isPublic: Boolean!

  """
  Direct, group or system
  """
  kind: ChatKind!

  """
  Time of the last message, the creation time for an empty chat
  """
  lastActivityAt: ISO8601DateTime!

  """
  Newest message the viewer may read, null when there is none
  """
  lastMessage: Message

  """
  Time of the newest message the viewer can read, null when there is none
  """
  lastMessageAt: ISO8601DateTime

  """
  Group or system logo. Null for a direct chat: use the other member
  """
  logoUrl: String

  """
  Counts and revision of the media library for checking a downloaded library
  """
  mediaLibrary(
    """
    Count only messages with a sequenceNumber up to this value, 0 or more.
    Absent counts the whole library. latestSequence ignores it
    """
    upToSequence: Int
  ): ChatMediaLibrary!

  """
  At most 100 members per page
  """
  members(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 30

    """
    Order of the members, JOINED when absent. A cursor fits only the order it was issued for
    """
    order: ChatMemberOrder = JOINED

    """
    Keep only these users, at most 100 User ids: the result is the candidates
    that are members of the chat, ordered by `order`. Paging still applies.
    Absent returns every member
    """
    userIds: [ID!]
  ): ChatMemberConnection!

  """
  Members of the chat the viewer can see, equal to members.totalCount
  """
  membersCount: Int!

  """
  Visible messages, at most 50 per page, newest first (oldest first with
  filter.afterSequence). The filter is the media library of the chat.
  filter.afterSequence returns the tail after a known sequenceNumber, oldest
  first. Deleted or edited messages while offline are not replayed
  """
  messages(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Media library filter, absent returns every message
    """
    filter: MessageFilter

    """
    Page size
    """
    first: Int = 30
  ): MessageConnection!

  """
  Messages the viewer can read in the chat, the same set as messages.totalCount without a filter
  """
  messagesCount: Int!

  """
  Group name, null for a direct chat: use the other member
  """
  name: String

  """
  The other participant of a direct chat. Null for a group or system chat, when
  the chat has no single other participant, or when the viewer cannot see that user
  """
  opponent: User

  """
  Group owner, null for other kinds or when the viewer cannot see the owner
  """
  owner: User

  """
  User id of the group owner, also when the viewer cannot see the owner. Null for a direct and a system chat
  """
  ownerId: ID

  """
  Non-decreasing revision derived from chat and viewer membership update times
  as epoch microseconds. It rises at least on chat, membership, viewer state,
  message creation and deletion, and last message row changes, and may rise on other changes
  """
  revision: Int64!

  """
  Link that opens the chat in the app for its members, resolved by chatByUuid
  """
  shareUrl: String!

  """
  Recap for the viewer, null until one is generated
  """
  summary: ChatSummary

  """
  Last change of the chat, its creation time when never changed
  """
  updatedAt: ISO8601DateTime!

  """
  The uuid of the share link, accepted by chatByUuid
  """
  uuid: String!

  """
  State of the chat for the viewer
  """
  viewerState: ChatViewerState!
}

