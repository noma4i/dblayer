"""
Requires that exactly one field must be supplied and that field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

"""
Account state
"""
enum AccountStatus {
  """
  Closed by the user
  """
  DEACTIVATED

  """
  Blocked by the team
  """
  DISABLED

  """
  Normal account
  """
  ENABLED

  """
  Allowed with restrictions
  """
  LIMITED
}

"""
One photo or video of an album. The position of the item in the list is its position in the album
"""
input AlbumItemInput {
  """
  Caption of the item
  """
  body: String

  """
  Key of the client for this message, unique among the messages of the author in
  the chat. Comes back as Message.clientKey to the author. A key already used
  answers DUPLICATE_CLIENT_KEY and nothing is sent
  """
  clientKey: String!

  """
  TEXT for a photo, VIDEO for a video, the other kinds answer INVALID_INPUT
  """
  kind: MessageKind!

  """
  signedId of an uploaded blob, becomes the media of the message
  """
  signedId: String!
}

"""
Result of messageAlbumSend
"""
type AlbumSendPayload {
  """
  The messages of the album in the order of the items, as the viewer sees them.
  A message the viewer cannot see any more is left out
  """
  messages: [Message!]!
}

"""
Progress of the media analysis
"""
enum AnalyzeStatus {
  """
  The analyzer finished, the scores are final
  """
  COMPLETED

  """
  The analyzer gave up, the scores stay empty
  """
  FAILED

  """
  Waiting for the analyzer
  """
  PENDING
}

"""
Hard limits the server enforces, read from the same constants the operations check
"""
type ApiLimits {
  """
  Largest first of chat.members
  """
  maxChatMembersPerPage: Int!

  """
  Most messages chatMessageSearch returns
  """
  maxChatSearchResults: Int!

  """
  Largest first of viewer.chats
  """
  maxChatsPerPage: Int!

  """
  Largest first of chat.messages
  """
  maxMessagesPerPage: Int!

  """
  Largest first of moment.visitors
  """
  maxMomentVisitorsPerPage: Int!

  """
  Largest first of moment lists
  """
  maxMomentsPerPage: Int!

  """
  Most ids one nodes query accepts
  """
  maxNodesPerQuery: Int!

  """
  Largest first of friends, requests and blocked users
  """
  maxRelationsPerPage: Int!

  """
  Longest query of search and chatMessageSearch, a longer one is INVALID_INPUT
  """
  maxSearchQueryLength: Int!

  """
  Largest file directUploadCreate and multipartUploadInit accept
  """
  maxUploadBytes: Int64!

  """
  Largest first of wallet.transactions
  """
  maxWalletTransactionsPerPage: Int!

  """
  Shortest query of search that looks into chats, a shorter query answers no chats
  """
  minChatSearchQueryLength: Int!
}

"""
One-to-one call of the viewer
"""
type Call implements Node {
  """
  When the callee answered
  """
  answeredAt: ISO8601DateTime

  """
  When the call started ringing
  """
  createdAt: ISO8601DateTime!

  """
  Whether the viewer placed the call or is the one called
  """
  direction: CallDirection!

  """
  When the call stopped
  """
  endedAt: ISO8601DateTime

  """
  Opaque stable identifier
  """
  id: ID!

  """
  What the call carries
  """
  mediaKind: CallMediaKind!

  """
  Who placed the call
  """
  origin: CallOrigin!

  """
  The other side, null when the viewer cannot see them or the call is a test call from the support back office
  """
  peer: User

  """
  Where the call is in its life
  """
  status: CallStatus!
}

"""
Autogenerated input type of CallAccept
"""
input CallAcceptInput {
  """
  Call to answer
  """
  callId: ID!

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String
}

"""
Autogenerated input type of CallDecline
"""
input CallDeclineInput {
  """
  Call to reject
  """
  callId: ID!

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String
}

"""
Which side of the call the viewer is
"""
enum CallDirection {
  """
  The viewer is the callee
  """
  INCOMING

  """
  The viewer placed the call
  """
  OUTGOING
}

"""
Autogenerated input type of CallEnd
"""
input CallEndInput {
  """
  Call to end
  """
  callId: ID!

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String
}

"""
Live news about a call of the viewer. Best effort and not replayed: after a lost connection read viewer.activeCall
"""
type CallEvent {
  """
  The call after the change
  """
  call: Call!

  """
  What happened
  """
  kind: CallEventKind!

  """
  When it happened
  """
  occurredAt: ISO8601DateTime!

  """
  The negotiation message, only for SIGNAL
  """
  signal: CallSignal
}

"""
What happened to a call
"""
enum CallEventKind {
  """
  The callee answered
  """
  ACCEPTED

  """
  The callee rejected the call
  """
  DECLINED

  """
  The call is over, call.status tells hang-up from missed
  """
  ENDED

  """
  Someone calls the viewer
  """
  INCOMING

  """
  The other side sent a negotiation signal
  """
  SIGNAL
}

"""
What a call carries
"""
enum CallMediaKind {
  """
  Voice only
  """
  AUDIO

  """
  Voice and camera
  """
  VIDEO
}

"""
Who placed the call
"""
enum CallOrigin {
  """
  A test call from the support back office, Call.peer is null
  """
  ADMIN_TEST

  """
  Another user of the app, see Call.peer
  """
  APP
}

"""
Result of a call action
"""
type CallPayload {
  """
  The call after the action
  """
  call: Call!

  """
  Servers for the peer connection of the viewer, only after callStart and callAccept
  """
  iceServers: [IceServer!]
}

"""
One WebRTC negotiation message from the other side of a call
"""
type CallSignal {
  """
  Candidate line for CANDIDATE
  """
  candidate: String

  """
  Negotiation step
  """
  kind: CallSignalKind!

  """
  Session description for OFFER and ANSWER
  """
  sdp: String

  """
  Index of the media section the candidate belongs to
  """
  sdpMLineIndex: Int

  """
  Media section the candidate belongs to
  """
  sdpMid: String
}

"""
Step of the WebRTC negotiation a signal carries
"""
enum CallSignalKind {
  """
  Session description answered by the callee, uses sdp
  """
  ANSWER

  """
  Network route candidate, uses candidate, sdpMid and sdpMLineIndex
  """
  CANDIDATE

  """
  Session description offered by the caller, uses sdp
  """
  OFFER
}

"""
Autogenerated input type of CallSignalSend
"""
input CallSignalSendInput {
  """
  Call the signal belongs to
  """
  callId: ID!

  """
  Candidate line for CANDIDATE
  """
  candidate: String

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String

  """
  Negotiation step
  """
  kind: CallSignalKind!

  """
  Session description for OFFER and ANSWER
  """
  sdp: String

  """
  Index of the media section the candidate belongs to
  """
  sdpMLineIndex: Int

  """
  Media section the candidate belongs to
  """
  sdpMid: String
}

"""
Autogenerated input type of CallStart
"""
input CallStartInput {
  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String

  """
  What the call carries
  """
  mediaKind: CallMediaKind = AUDIO

  """
  User to call
  """
  userId: ID!
}

"""
Where a call is in its life
"""
enum CallStatus {
  """
  Answered, the media flows
  """
  ACCEPTED

  """
  The callee rejected the call
  """
  DECLINED

  """
  One side hung up
  """
  ENDED

  """
  The call broke down
  """
  FAILED

  """
  Nobody answered in time
  """
  MISSED

  """
  Waiting for the callee to answer
  """
  RINGING
}

