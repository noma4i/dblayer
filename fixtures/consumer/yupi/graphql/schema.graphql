"""
A client checks a downloaded library using equal revision and equal prefix
counts. Sequence numbers only grow, so deletes in the prefix change counts.
Edits of old rows change revision
"""
type ChatMediaLibrary {
  """
  Messages that carry a stored audio file: the totalCount of messages(filter: { mediaKinds: [AUDIO] })
  """
  audioCount: Int!

  """
  Gift messages: the totalCount of messages(filter: { includeGifts: true })
  """
  giftCount: Int!

  """
  Largest sequenceNumber among all visible messages of the chat, 0 when there are none. Not limited by upToSequence
  """
  latestSequence: Int!

  """
  Revision of the whole chat media library, independent of upToSequence
  """
  revision: Int64!

  """
  Messages that carry a stored image or video: the totalCount of
  messages(filter: { mediaKinds: [IMAGE, VIDEO] }). Giphy based GIF messages
  store no file and are not counted
  """
  visualCount: Int!
}

"""
Members visible to the viewer, in join order. Members the viewer cannot see are left out
"""
type ChatMemberConnection {
  """
  Members of the page, in order
  """
  edges: [ChatMemberEdge!]!

  """
  Position of the page in the list
  """
  pageInfo: PageInfo!

  """
  Members visible to the viewer, whatever the page and the userIds filter.
  Equals Chat.membersCount. Counted only when selected
  """
  totalCount: Int!
}

"""
Chat member of a page with its cursor
"""
type ChatMemberEdge {
  """
  Opaque position of this item, pass it as after to read the items behind it
  """
  cursor: Cursor!

  """
  The item
  """
  node: User!
}

"""
Order of the members of a chat. A cursor fits only the order it was issued for
"""
enum ChatMemberOrder {
  """
  In the order the members joined the chat, the default
  """
  JOINED

  """
  The owner first, then the other members by username in binary (code unit)
  order, uppercase before lowercase, as the V2 client sorted, members without a username last
  """
  OWNER_FIRST
}

