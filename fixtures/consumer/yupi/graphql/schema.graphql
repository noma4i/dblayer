  messagePrompts(
    """
    Locale code of the client such as en or pt-BR, case does not matter. An unsupported code gives English
    """
    locale: String!

    """
    Screen the prompts are for
    """
    placement: PromptPlacement!
  ): [MessagePromptItem!]!

  """
  Visible moment found by its public uuid
  """
  momentByUuid(
    """
    uuid of a moment, as in the share link
    """
    uuid: String!
  ): Moment

  """
  Visible entity or null
  """
  node(
    """
    Opaque id of any entity that has one
    """
    id: ID!
  ): Node

  """
  At most 100 ids, keeps order and duplicates, null for each unavailable id
  """
  nodes(
    """
    Opaque ids, the answer keeps their order and holds null for a missing one
    """
    ids: [ID!]!
  ): [Node]!

  """
  Credit prices of the paid actions
  """
  pricing: Pricing!

  """
  Search over users, moments and chats the viewer may see. The query is 1..50
  characters, @name finds usernames, #tag finds hashtag moments, chats need 3
  characters (limits.minChatSearchQueryLength, limits.maxSearchQueryLength). A
  search backend failure is a server error, not an empty answer
  """
  search(
    """
    Narrows the search
    """
    filter: SearchFilter

    """
    Text to look for
    """
    query: String!
  ): SearchResult!

  """
  Developer accounts only. Moments in shadow ban, newest ban first
  """
  shadowBannedMoments(
    """
    Cursor of the last moment of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 20
  ): ShadowBannedMomentConnection!

  """
  In-app purchase products of one store
  """
  storeProducts(
    """
    Cursor of the last product of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 20

    """
    Store to list the products of
    """
    kind: PurchaseKind!
  ): StoreProductConnection!

  """
  Connections accepted by the other side whose Connected overlay the viewer has
  not seen yet, newest accept first, at most 50. Empty when there are none
  """
  unseenConnections: [ConnectedOverlay!]!

  """
  Visible public profile
  """
  user(
    """
    Id of the user
    """
    id: ID!
  ): User

  """
  Visible public profile found by username
  """
  userByHandle(
    """
    Username without the at sign
    """
    handle: String!
  ): User

  """
  Visible public profile found by the uuid of its share link
  """
  userByUuid(
    """
    uuid of a user, as in the share link
    """
    uuid: String!
  ): User

  """
  Published vibes the viewer may open, in display order. Gated vibes are left out for viewers who do not meet the gate
  """
  vibes: [Vibe!]!

  """
  The authenticated user
  """
  viewer: Viewer!
}

