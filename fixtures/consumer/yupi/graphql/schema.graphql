  activeCall: Call

  """
  Users the viewer blocked, newest block first. Includes users that also blocked the viewer so each can be unblocked
  """
  blockedUsers(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 25
  ): UserListConnection!

  """
  Order: SYSTEM first, then pinned by the viewer, premium for the viewer,
  unreadCount greater than 0 from others, lastActivityAt descending, and chat id
  descending. There is no pin time. Membership is viewerState.lists: a premium
  received chat is in both lists, while viewerState.list is its home list. The
  order is live, so a client rereads the first page after a read. Cursors belong
  to this account, list filter and order, and a cursor of an older order is
  refused with INVALID_CURSOR. Deleted chats and chats the viewer lost access to
  are not returned: deletion is physical and leaves no tombstone. A client drops
  them from a live ChangeEvent (area CHAT, kind DELETED or ACCESS_REVOKED) and
  by comparing its stored list with a full read made without updatedAfter
  """
  chats(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Narrows the list
    """
    filter: ChatFilter

    """
    Page size
    """
    first: Int = 30

    """
    Only chats changed after this time: the chat itself, its last message or the
    viewer pin, mute and read state. Same order and cursors. Deleted chats and
    chats the viewer lost access to are not returned, so this read never reports
    a removal: use a live ChangeEvent (area CHAT, kind DELETED or
    ACCESS_REVOKED) or a full read without updatedAfter
    """
    updatedAfter: ISO8601DateTime
  ): ChatConnection!

  """
  Own moments with similar moments, unseen first
  """
  compassMoments(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 10
  ): MomentConnection!

  """
  Unread and chat counters
  """
  counters: ViewerCounters!

  """
  Accepted friends the viewer can see, ordered by account creation time of the
  friend, newest account first (not by the time of friendship)
  """
  friends(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 25
  ): UserListConnection!

  """
  Users with a pending request to the viewer, newest request first
  """
  incomingRequests(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 25
  ): UserListConnection!

  """
  Own basic moments newest first, drafted and still analyzing ones included
  """
  moments(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 20
  ): MomentConnection!

  """
  Users the viewer sent a pending request to, newest request first
  """
  outgoingRequests(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 25
  ): UserListConnection!

  """
  Private profile data
  """
  profile: PrivateProfile!

  """
  Editable preferences
  """
  settings: Settings!

  """
  Public profile of the viewer
  """
  user: User!

  """
  Balance, premium and ledger of the viewer
  """
  wallet: Wallet!
}

"""
Counters of the viewer chat lists and compass
"""
type ViewerCounters {
  """
  Premium chats in the secondary list
  """
  premiumSecondaryChats: Int!

  """
  Chats in the primary list
  """
  primaryChats: Int!

  """
  Chats in the secondary list
  """
  secondaryChats: Int!

  """
  Visible chats, primary and secondary, with unread messages
  """
  unreadChats: Int!

  """
  Compass suggestions the viewer has not seen
  """
  unreadCompass: Int!

  """
  Chats in the secondary list with unread messages, included in unreadChats
  """
  unreadSecondaryChats: Int!
}

"""
Result of a mutation that changes the account: the account as it is now
"""
type ViewerPayload {
  """
  The viewer after the change
  """
  viewer: Viewer!
}

"""
Direction of a visitor list, which is always ordered by user id. A cursor is valid only for the direction it was issued for
"""
enum VisitorOrder {
  """
  Smallest user id first
  """
  ID_ASC

  """
  Largest user id first, the first page is the newest accounts
  """
  ID_DESC
}

"""
Balance, premium and ledger of the viewer. Only the viewer reaches it
"""
type Wallet {
  """
  Credits the viewer can spend
  """
  balance: Int!

  """
  The current premium grant, null without one
  """
  premium: PremiumGrant

  """
  Ledger rows newest first. Cursors belong to this account and kind
  """
  transactions(
    """
    Cursor of the last item of the previous page, absent for the first page
    """
    after: Cursor

    """
    Page size
    """
    first: Int = 20

    """
    Only credits or only debits
    """
    kind: LedgerEntryKind
  ): WalletTransactionConnection!
}

"""
Ledger row of the viewer. Only the owner reads it
"""
type WalletTransaction implements Node {
  """
  Credits moved, always positive, the kind gives the direction
  """
  amount: Int!

  """
  Creation time
  """
  createdAt: ISO8601DateTime!

  """
  Credits of a spend covered by the premium grant. 0 for a credit and for a spend paid from the balance
  """
  creditAmount: Int!

  """
  Currency of the price. AUD for a row without a purchase, such as a spend or a
  campaign credit. Null only when the store reported none
  """
  currency: String

  """
  Longer text of the entry
  """
  description: String

  """
  Catalog gift of a gift spend
  """
  gift: Gift

  """
  Opaque stable identifier
  """
  id: ID!

  """
  Credit adds to the balance, debit takes from it
  """
  kind: LedgerEntryKind!

  """
  Price text of priceMilliUnits in currency, such as $0.00 for a spend. Null only when the store reported no currency
  """
  localizedPrice: String

  """
  Paid price in thousandths of the currency unit. 0 for a spend and for a credit without a purchase
  """
  priceMilliUnits: Int64!

  """
  Receiver of a gift or intro spend, null when the viewer cannot see them
  """
  recipient: User

  """
  Display subtitle
  """
  subtitle: String

  """
  Display title
  """
  title: String

  """
  Last change time
  """
  updatedAt: ISO8601DateTime!
}

"""
Page of wallet transactions, newest first
"""
type WalletTransactionConnection {
  """
  Transactions of the page, newest first
  """
  edges: [WalletTransactionEdge!]!

  """
  Position of the page in the list
  """
  pageInfo: PageInfo!
}

"""
Wallet transaction of a page with its cursor
"""
type WalletTransactionEdge {
  """
  Opaque position of this item, pass it as after to read the items behind it
  """
  cursor: Cursor!

  """
  The item
  """
  node: WalletTransaction!
}
