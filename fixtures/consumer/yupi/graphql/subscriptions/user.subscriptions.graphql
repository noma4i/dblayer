subscription userUpdated {
  viewerChanges {
    occurredAt
    changes {
      area
      kind
      entityId
    }
  }
}

subscription userCounters {
  viewerChanges {
    occurredAt
    changes {
      area
      kind
      entityId
    }
  }
}

subscription userBlocked {
  viewerNotice {
    kind
    title
    body
    occurredAt
  }
}

subscription financeTransaction {
  viewerChanges {
    occurredAt
    changes {
      area
      kind
      entityId
    }
  }
}

subscription giftOpened {
  viewerChanges {
    occurredAt
    changes {
      area
      kind
      entityId
    }
  }
}

subscription interactiveAction {
  interactionReceived {
    action
    actorUserId
    messageId
    chatId
    occurredAt
  }
}

subscription DblayerViewerChanges {
  viewerChanges {
    changes {
      area
      kind
      entityId
      parentId
      chat {
        ...ChatFragment
        shareUrl
        isPublic
        history
      }
      message {
        ...MessageFragment
        clientKey
      }
    }
  }
}
