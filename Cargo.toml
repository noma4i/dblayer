[workspace]
resolver = "2"
members = ["core", "gen", "bindgen"]
exclude = ["core/vendor/statig_macro"]

[profile.release]
opt-level = 3
lto = false
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

[patch.crates-io]
statig_macro = { path = "core/vendor/statig_macro" }
