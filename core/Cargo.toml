[package]
name = "dblayer"
version = "6.50.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "dblayer"


[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
aes-gcm = "0.10"
arc-swap = "1.9.2"
async-trait = "0.1.92"
base64 = "0.22"
hkdf = "0.13"
im = "15.1.0"
lru = "0.18.5"
md-5 = "0.11.0"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.11.0"
statig = "=0.4.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync", "macros"] }
uniffi = "0.32.2"
uuid = { version = "1.27.0", features = ["v4"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
zeroize = "1.9"

[target.'cfg(dblayer_loom)'.dev-dependencies]
loom = "0.7"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "trace"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
