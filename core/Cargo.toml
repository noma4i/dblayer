[package]
name = "dblayer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "dblayer"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
uniffi = { version = "0.32.2", features = ["cli"] }
