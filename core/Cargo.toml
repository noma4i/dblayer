[package]
name = "dblayer"
version = "1.0.1"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "dblayer"

[features]
cli = ["uniffi/cli"]
stress = ["tokio/rt-multi-thread", "tokio/test-util"]
bench = ["dep:tempfile"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[[bin]]
name = "stress"
path = "src/bin/stress.rs"
required-features = ["stress"]

[[bin]]
name = "rowbench"
path = "src/bin/rowbench.rs"
required-features = ["bench"]

[dependencies]
tempfile = { version = "3.27.0", optional = true }
async-trait = "0.1.92"
base64 = "0.22"
lru = "0.18.5"
md-5 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "time", "sync", "macros"] }
uniffi = "0.32.2"
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "trace"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["test-util"] }
